name: ziqx-ae-einvoice-validator

# Independent deployment. The host reverse proxy supplies HTTPS.
services:
  validator:
    image: ${VALIDATOR_IMAGE:-ghcr.io/fathah/ae-einvoice-validator:latest}
    restart: unless-stopped
    init: true
    env_file: [.env]
    ports:
      - "127.0.0.1:${VALIDATOR_BIND_PORT:-8091}:8081"
    networks: [validation]
    read_only: true
    user: "65532:65532"
    tmpfs: ["/tmp:size=33554432,mode=0700,uid=65532,gid=65532,noexec,nosuid,nodev"]
    mem_limit: 1536m
    cpus: 2
    pids_limit: 96
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    stop_grace_period: 30s

networks:
  validation:
    driver: bridge
