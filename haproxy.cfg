global
  maxconn 64
  hard-stop-after 25s

defaults
  mode http
  timeout connect 3s
  timeout client 35s
  timeout server 30s
  timeout http-request 5s
  timeout http-keep-alive 5s
  timeout check 3s
  retries 0

resolvers docker
  nameserver docker 127.0.0.11:53
  hold valid 5s
  timeout resolve 1s
  timeout retry 1s

frontend api
  bind :8080
  default_backend validator

backend validator
  option httpchk
  http-check send meth GET uri /v1/healthz ver HTTP/1.1 hdr Host validator
  http-check expect status 200
  server validator validator:8081 check inter 2s fall 2 rise 1 resolvers docker resolve-prefer ipv4 init-addr none
